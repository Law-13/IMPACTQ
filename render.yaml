services:
  - type: web
    name: impactq-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Ensure you set the GEMINI_API_KEY environment variable manually in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false
